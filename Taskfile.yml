version: '3'

tasks:
  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  test:
    desc: Run tests with coverage
    cmds:
      - go test ./... -coverprofile=coverage.out

  build:
    desc: Run the complete local validation and snapshot build
    cmds:
      - go mod tidy
      - golangci-lint run ./...
      - govulncheck ./...
      - go vet ./...
      - gofmt -l .
      - go test ./... -coverprofile=coverage.out
      - goreleaser build --snapshot --clean

  release:
    desc: Build a release locally without publishing
    cmds:
      - go mod tidy
      - goreleaser release --clean --skip=publish,sign,sbom

  plugin:stage:
    desc: Build this plugin and stage it into ironstate's per-user plugin cache for local testing
    vars:
      VERSION: '{{.VERSION | default "v0.0.0-dev"}}'
      BINARY: 'dist/ironstate-handler-hosts{{if eq OS "windows"}}.exe{{end}}'
    cmds:
      - go build -o {{.BINARY}} .
      - go run ./tools/stagelocal stage --org camalot --name hosts --version {{.VERSION}} --binary {{.BINARY}} --handlers entry

  plugin:unstage:
    desc: Remove the staged local dev build of this plugin from ironstate's plugin cache
    vars:
      VERSION: '{{.VERSION | default "v0.0.0-dev"}}'
    cmds:
      - go run ./tools/stagelocal unstage --org camalot --name hosts --version {{.VERSION}}
